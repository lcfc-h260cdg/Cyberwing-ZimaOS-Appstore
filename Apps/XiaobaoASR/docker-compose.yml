name: xiaobao-asr

services:
  asr-service:
    # v1.0.0
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/sherpa-onnx-asr:devel-20260831
    container_name: asr-service
    restart: unless-stopped
    network_mode: host
    environment:
      MODEL: paraformer
      RULE: "on"
      CHUNK_SECONDS: "30"
      CHUNK_THRESHOLD: "60"
      WORKER_COUNT: "1"
      SHORT_AUDIO_THRESHOLD: "60"
      MODEL_THREADS: "2"

# networks:
#   default:
#     name: xiaobao-asr_default

x-casaos:
  id: com.mycyberwing.xiaobao-asr
  main: asr-service
  icon: "https://zimaos-store.oss-cn-beijing.aliyuncs.com/XiaobaoASR/icon.png"
  title:
    zh_CN: 小宝语音识别服务
    en_US: "Xiaobao ASR Service"
  tagline:
    zh_CN: 小宝语音识别服务
    en_US: "ASR Service for Cyberwing Device"
  description:
    zh_CN: 小宝语音识别服务
    en_US: "ASR Service for Cyberwing Device"
  tips: {}
  author: LCFC
  developer: hjx
  category: AI
  architectures:
    - amd64
  version: "1.0.0"
  update_at: "2026-08-31"
  release_notes:
    zh_CN: |-
      - "2026-08-31 首个版本"
    en_US: |-
      - "2026-08-31 First release"
