name: smart-file-search

services:
  llm_server:
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/llm_server:v2.1.2
    container_name: llm_server
    restart: always
    volumes:
      - /DATA:/DATA:rslave
      - /media:/media:rslave

      - type: bind
        source: /DATA/AppData/AI_MODELS/llm-server
        target: /data/models
        bind:
          create_host_path: true
      - type: bind
        source: /tmp
        target: /tmp
        bind:
          create_host_path: true
    environment:
      LLM_CPU_PINNING: "true"
      LLM_CPU_THREADS: "4"
      LLM_OV_NUM_STREAMS: "1"
      MODEL_ROOT: /data/models
      TOKENIZERS_PARALLELISM: "false"
      TZ: Asia/Shanghai
    network_mode: host
    privileged: true
    command:
      - /app/llm_server
    entrypoint: []
    devices:
      - /dev/dri:/dev/dri
    # Image/audio semantic search loads chat, dense, sparse, CLIP and rerank
    # models in the same cgroup. 17 GiB is below the observed peak and causes
    # the launcher to kill every model process after two ordinary searches.
    mem_limit: "22g"
    mem_reservation: "10g"
    # Equal memory/swap limits prevent model pages from filling host swap.
    memswap_limit: "22g"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
        compress: "true"

  pgvector-nas:
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/pgvector/pgvector:pg18-trixie
    container_name: pgvector-nas
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - /DATA/AppData/LCFC_APP/data/ai_api_data/pgvector_nas_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: lcfc
      POSTGRES_PASSWORD: lcfc
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: Asia/Shanghai
    mem_limit: "1536m"
    mem_reservation: "512m"
    memswap_limit: "1536m"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
        compress: "true"

  file-search-service:
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/file-rag-nas:v2.0.0_20260706
    container_name: file-search-service
    restart: always
    volumes:
      # User file roots. Keep original host paths inside the container.
      - /DATA:/DATA:rslave
      - /media:/media:rslave

      # Service state and config.
      - /DATA/AppData/LCFC_APP/data/ai_api_data/file-search-service/parsing_service:/data/ai-core/parsing_service
      - /DATA/AppData/LCFC_APP/data/ai_api_data/file-search-service/config:/NAS_Route/config

      # Service logs.
      - /DATA/AppData/LCFC_APP/data/ai_api_data/logs/file-search-service/parsing_service:/RagBaseHaystack_svn/parsing_log
      - /DATA/AppData/LCFC_APP/data/ai_api_data/logs/file-search-service/document_analysis:/RagBaseHaystack_svn/data_loader/RagDocumentAnalysis/log
      - /DATA/AppData/LCFC_APP/data/ai_api_data/logs/file-search-service/nas_query:/data/ai-core/nas_query/logs
      - /DATA/AppData/LCFC_APP/data/ai_api_data/logs/file-search-service/nas_retrieval:/Nas_Retrieval_Final_031/logs
      - /DATA/AppData/LCFC_APP/data/ai_api_data/logs/file-search-service/nas_route:/NAS_Route/logs
    environment:
      AUTO_INIT_CONFIG: "true"
      CONFIG_DIR: /NAS_Route/config
      FLASK_DEBUG: "false"
      FLASK_ENV: production
      GENERATION_TEMPERATURE: "0.7"
      HOST: 0.0.0.0
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      LOG_DIR: /NAS_Route/logs
      MODEL_NAME: OpenAI
      NAS_ROUTE_PORT: "20191"
      OPENAI_API_KEY: sk-abcdefg0123456789abcdefg
      OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
      OPENAI_MODEL: qwen-plus
      PORT: "20194"
      PYTHONUNBUFFERED: "1"
      RAG_TEMPERATURE: "0"
      TZ: Asia/Shanghai
    network_mode: host
    healthcheck:
      test:
        - CMD
        - sh
        - -c
        - curl -f http://localhost:20194/health && curl -f http://localhost:20193/health && curl -f http://localhost:20192/docs && curl -f http://localhost:20191/health
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 120s
    command:
      - sh
      - -c
      - /start.sh
    mem_limit: "4608m"
    mem_reservation: "3g"
    memswap_limit: "4608m"
    cpus: 4.0
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
        compress: "true"

  ai-api:
    # v2.1.1
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/ai-api:devel-20260915
    container_name: ai-api
    restart: always
    depends_on:
      - llm_server
      - pgvector-nas
      - file-search-service
    volumes:
      # API service data.
      - /DATA/AppData/LCFC_APP/data/ai_api_data/data_base:/app/data/data_base
      - /DATA/AppData/LCFC_APP/data/ai_api_data/vector_db:/app/data/vector_db
      - /DATA/AppData/LCFC_APP/data/ai_api_data/vector_cache:/app/data/vector_cache
      - /DATA/AppData/LCFC_APP/data/ai_api_data/content_analysis_cache:/app/data/content_analysis_cache
      - /DATA/AppData/LCFC_APP/data/ai_api_data/logs/ai-api:/app/data/logs
      - /DATA/AppData/LCFC_APP/data/ai_api_data/configs:/app/data/configs

      # Shared model root.
      - /DATA/AppData/AI_MODELS/llm-server:/data/models

      # User file roots. Keep original host paths inside the container.
      - /DATA:/DATA:rslave
      - /media:/media:rslave

      # ILAB data.
      - /DATA/AppData/LCFC_APP/data/ai_api_data/ilab_data_base:/app/ilab/data/data_base
      - /DATA/AppData/LCFC_APP/data/ai_api_data/ilab_vector_db:/app/ilab/data/vector_db
      - /DATA/AppData/LCFC_APP/data/ai_api_data/ilab_milvus_data:/app/ilab/data/milvus_data
      - /DATA/AppData/LCFC_APP/data/ai_api_data/ilab_logs:/app/ilab/data/logs
      - /DATA/AppData/LCFC_APP/data/ai_api_data/ilab_config:/app/ilab/data/configs
      - /DATA/AppData/LCFC_APP/data/ai_api_data/ilab_content_analysis_cache:/app/ilab/data/content_analysis_cache

      # Host system info required by the API.
      - /sys/class/dmi/id:/sys/class/dmi/id:ro
      - /opt:/opt
      - /tmp:/tmp
    environment:
      TZ: Asia/Shanghai
      ENABLE_NAS_NOTIFY: "false"
      # xiaobao-asr runs locally on the host; ai-api uses host networking.
      LLM_ASR_URL: "http://127.0.0.1:5001"
      ASR_POLL_INTERVAL: "2"
      FILE_WATCH_SETTINGS_PATH: /app/filewatchsettings.yaml
      DOCUMENT_INDEX_STATE_DB: /app/data/data_base/document_index_state.sqlite3
      DOCUMENT_INDEX_RECONCILE_SECONDS: "300"
      DOCUMENT_INDEX_RECONCILE_BATCH_SIZE: "1"
      DOCUMENT_RECONCILE_MAX_EXTERNAL_BYTES: "33554432"
      DOCUMENT_RECONCILE_MAX_LIGHTWEIGHT_BYTES: "268435456"
      DOCUMENT_PDF_IMAGE_OCR_ENABLED: "true"
      DOCUMENT_PDF_OCR_MAX_PAGES: "10"
      DOCUMENT_PDF_OCR_MAX_DIMENSION: "1600"
      DOCUMENT_PDF_OCR_PAGE_TIMEOUT_SECONDS: "90"
      DOCUMENT_PDF_OCR_TOTAL_TIMEOUT_SECONDS: "300"
      DOCUMENT_PDF_OCR_LANG: "chi_sim+eng"
      DOCUMENT_EXTERNAL_PARSE_MAX_TIMEOUT_SECONDS: "600"
      DOCUMENT_PPT_IMAGE_OCR_ENABLED: "false"
      DOCUMENT_PPT_OCR_MAX_IMAGES: "6"
      DOCUMENT_PPT_OCR_MAX_DIMENSION: "1600"
      DOCUMENT_PPT_OCR_IMAGE_TIMEOUT_SECONDS: "90"
      DOCUMENT_PPT_OCR_TOTAL_TIMEOUT_SECONDS: "120"
      FILE_SEARCH_POSTGRES_DSN: "postgresql://lcfc:lcfc@127.0.0.1:5434/postgres"
      FILE_SEARCH_POSTGRES_TABLE: "files_search_table2"
      MILVUS_WATCHDOG_ENABLED: "true"
      MILVUS_WATCHDOG_START_DELAY_SECONDS: "60"
      MILVUS_WATCHDOG_INTERVAL_SECONDS: "20"
      MILVUS_WATCHDOG_FAILURE_THRESHOLD: "3"
      MILVUS_WATCHDOG_HTTP_TIMEOUT_SECONDS: "10"
      MILVUS_HEALTH_TIMEOUT_SECONDS: "5"
      # Shared guard for main/ILAB background indexing. Search APIs remain online.
      BACKGROUND_RESOURCE_GUARD_ENABLED: "true"
      # This 31 GiB device has about 6 GiB available after interactive image
      # search loads the resident vision model. Higher gates permanently starve
      # a clean rebuild despite zero memory PSI and 5+ GiB cgroup headroom.
      # Keep a 5 GiB reserve. The shared model server retains about 11 GiB of
      # OpenVINO shared-memory pages after switching models, so a higher resume
      # watermark cannot be reached while indexing is paused. Swap, PSI, load
      # and cgroup guards below remain in force for real pressure.
      BACKGROUND_MIN_AVAILABLE_GB: "5"
      BACKGROUND_RESUME_AVAILABLE_GB: "5"
      # Swap occupancy is historical. Only use it as an additional blocker
      # below the 5 GiB memory safety line, never as a standalone latch.
      BACKGROUND_SWAP_GUARD_AVAILABLE_GB: "5"
      BACKGROUND_MAX_SWAP_PERCENT: "70"
      BACKGROUND_RESUME_SWAP_PERCENT: "60"
      BACKGROUND_MAX_MEMORY_PSI_FULL_AVG10: "1"
      BACKGROUND_RESUME_MEMORY_PSI_FULL_AVG10: "0.5"
      BACKGROUND_MAX_IO_PSI_FULL_AVG10: "30"
      BACKGROUND_RESUME_IO_PSI_FULL_AVG10: "15"
      BACKGROUND_MAX_LOAD_PER_CPU: "4"
      BACKGROUND_RESUME_LOAD_PER_CPU: "2"
      BACKGROUND_RESOURCE_CHECK_SECONDS: "20"
      BACKGROUND_RESOURCE_RESUME_SAMPLES: "2"
      BACKGROUND_WORK_LOCK_PATH: /tmp/ai-studio-background-work.lock
      BACKGROUND_TASK_PAUSE_FILE: /app/data/data_base/background_tasks.paused
      # Picture summaries are optional enrichment. A cold Qwen/VLM load needs a
      # larger reserve; successful consecutive summaries reuse the loaded model
      # under a lower reserve while Swap/PSI/load/cgroup guards stay enforced.
      PICTURE_SUMMARY_COLD_MIN_AVAILABLE_GB: "7.5"
      PICTURE_SUMMARY_COLD_RESUME_AVAILABLE_GB: "7.5"
      PICTURE_SUMMARY_WARM_MIN_AVAILABLE_GB: "3"
      PICTURE_SUMMARY_WARM_RESUME_AVAILABLE_GB: "3.5"
      PICTURE_SUMMARY_WARM_WINDOW_SECONDS: "300"
      # Rebuilding a cleared DB can reuse durable CLIP/face analysis. Cache hits
      # do not load models and may proceed below the cold-task reserve.
      PICTURE_VECTOR_CACHE_MIN_AVAILABLE_GB: "3"
      PICTURE_VECTOR_CACHE_RESUME_AVAILABLE_GB: "3.5"
      MEDIA_CACHE_REPLAY_MIN_AVAILABLE_GB: "3"
      MEDIA_CACHE_REPLAY_RESUME_AVAILABLE_GB: "3.5"
      FILE_TASK_STATUS_POLL_SECONDS: "10"
      FILE_TASK_STATUS_TIMEOUT_SECONDS: "3600"
      FILE_TASK_MISSING_RECHECKS: "3"
      # Bound long/hallucinated ASR text before local-LLM summarization. Full
      # transcripts are still indexed in 500-character searchable chunks.
      # A 5,000-character window reproduced a global OOM on this 31 GiB
      # appliance. Keep model requests near the empirically stable size; full
      # transcripts remain searchable through the chunk vectors below.
      AUDIO_SUMMARY_INPUT_MAX_CHARS: "1000"
      AUDIO_SUMMARY_MAX_PARTS: "4"
      AUDIO_EMBEDDING_BATCH_SIZE: "8"
    network_mode: host
    privileged: true
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --max-time 10 http://localhost:20100/health/milvus && curl -fsS --max-time 10 http://localhost:20190/docs || exit 1
      timeout: 10s
      interval: 30s
      retries: 3
      start_period: 2m0s
    mem_limit: "8g"
    mem_reservation: "4g"
    memswap_limit: "8g"
    cpus: 10.0
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
        compress: "true"
  
  asr-service:
    # v1.0.0
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/sherpa-onnx-asr:devel-20260831
    container_name: asr-service
    restart: unless-stopped
    network_mode: host
    environment:
      MODEL: paraformer
      RULE: "on"
      CHUNK_SECONDS: "30"
      CHUNK_THRESHOLD: "60"
      WORKER_COUNT: "1"
      SHORT_AUDIO_THRESHOLD: "60"
      MODEL_THREADS: "2"

