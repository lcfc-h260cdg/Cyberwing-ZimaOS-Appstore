name: xiaobao-agent-v2

services:
  hermes-master:
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/hermes-master:v2.0.0-beta1
    container_name: hermes-master
    restart: always
    # depends_on:
    #   hermes-agent-image-preload:
    #     condition: service_completed_successfully
    #     required: true
    ports:
      - "8686:8686"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/localtime:/etc/localtime:ro
      - /DATA/AppData/LCFC_APP/data/hermes_master_agent:/DATA/AppData/LCFC_APP/data/hermes_master_agent
      - /DATA/AppData/LCFC_APP/data/hermes_master/data:/opt/hermes-master/data
      - /DATA/AppData/LCFC_APP/data/hermes_master/logs:/opt/hermes-master/logs
      - /DATA/AppData/LCFC_APP/data/hermes_master/config:/opt/hermes-master/conf
    environment:
      DOCKER_SETTINGS__NETWORK: hermes-master-net
      DOCKER_SETTINGS__USER_DATA_ROOT: /DATA/AppData/LCFC_APP/data/hermes_master_agent
      MASTER_CONFIG_SYNC: missing
      MASTER_SETTINGS__PORT: "8686"
      TZ: Asia/Shanghai
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hermes-master-net

  hermes-web:
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/hermes-web:v2.0.0-beta1
    container_name: hermes-web
    restart: unless-stopped
    depends_on:
      - hermes-master
    ports:
      - "8085:80"
    networks:
      - hermes-master-net

  hermes-agent-v2-image-preload:
    image: docker-cyberwing-registry.cn-hangzhou.cr.aliyuncs.com/cyberwing/hermes-agent-custom:v2.0.0-beta1
    container_name: xiaobao-agent-v2-image-preload
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - "true"

networks:
  hermes-master-net:
    name: hermes-master-net
    driver: bridge

x-casaos:
  id: com.mycyberwing.xiaobao-agent-v2
  main: hermes-web
  index: /
  port_map: "8085"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/lcfc-h260cdg/Cyberwing-ZimaOS-Appstore@gh-pages/apps/com.mycyberwing.xiaobao-agent-v2/assets/icon.png
  title:
    zh_CN: "小宝智能体 2.0"
    en_US: "Xiaobao Agent 2.0"
  version: "2.0.0"
